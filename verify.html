<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maanyata Gate Check</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  video, canvas { width: 100%; max-height: 300px; background: #000; border-radius: 8px; }
  textarea { width: 100%; height: 80px; font-size: 16px; box-sizing: border-box; }
  button { font-size: 18px; padding: 14px; width: 100%; margin-top: 8px; min-height: 56px; border: 0; border-radius: 8px; background: #222; color: #fff; }
  #result { margin-top: 16px; padding: 24px 16px; border-radius: 8px; text-align: center; font-size: 22px; font-weight: 600; }
  .ok { background: #1b8a3a; color: #fff; }
  .bad { background: #b3261e; color: #fff; }
  .idle { background: #eee; color: #333; }
</style>
</head>
<body>
<h1>Gate check</h1>

<!-- Paste the output of: node issue.mjs pubkey -->
<script>
  const ISSUER_PUBLIC_KEY_B64URL = "nDSxM880-_l5Vtzjkhp_Mj6D7kfx4fp0zWKWl66Alps";
</script>

<video id="cam" playsinline muted></video>
<canvas id="frame" hidden></canvas>
<button id="startCam">Start camera scan</button>

<p>Or paste the code:</p>
<textarea id="manual" placeholder="Paste worker code here"></textarea>
<button id="checkManual">Check code</button>

<div id="result" class="idle">Waiting for a code</div>

<!-- jsQR & TweetNaCl: offline-capable QR decoder & legacy Ed25519 fallback loaded locally -->
<script src="./jsQR.js"></script>
<script src="./tweetnacl.min.js"></script>
<script>
  const resultEl = document.getElementById("result");

  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  }

  function show(kind, text) {
    resultEl.className = kind;
    resultEl.textContent = text;
  }

  async function checkCode(raw) {
    try {
      const trimmed = raw.trim();

      // Extract token string (handles raw token or URL wrapper)
      let token = trimmed;
      if (trimmed.includes("?")) {
        try {
          const url = new URL(trimmed.startsWith("http") ? trimmed : `https://dummy.host/${trimmed}`);
          token = url.searchParams.get("token") || url.searchParams.get("sig") || url.searchParams.get("p") || trimmed;
        } catch(e) {}
      }

      // Bug 3 Fix: Reject unauthenticated raw JSON or unsigned passes immediately
      if (token.startsWith("{") || !token.includes(".")) {
        return show("bad", "REJECTED: Unsigned Pass\nMissing Ed25519 cryptographic signature. QR code is unauthenticated or self-generated.");
      }

      // Cryptographic Ed25519 Signature Verification
      const [body, sig] = token.split(".");
      if (!body || !sig) {
        return show("bad", "REJECTED: Malformed Code\nMissing signature components.");
      }

      if (ISSUER_PUBLIC_KEY_B64URL.startsWith("PASTE")) {
        return show("bad", "Setup needed: add the issuer public key");
      }

      let ok = false;
      const pubBytes = b64urlToBytes(ISSUER_PUBLIC_KEY_B64URL);
      const sigBytes = b64urlToBytes(sig);
      const msgBytes = new TextEncoder().encode(body);

      // Strategy 1: Try modern hardware-accelerated WebCrypto Ed25519 (Chrome 113+)
      if (window.crypto && crypto.subtle && crypto.subtle.verify) {
        try {
          const key = await crypto.subtle.importKey(
            "raw",
            pubBytes,
            { name: "Ed25519" },
            false,
            ["verify"]
          );
          ok = await crypto.subtle.verify("Ed25519", key, sigBytes, msgBytes);
        } catch (webCryptoErr) {
          // WebCrypto failed (e.g. legacy Android WebView < Chrome 113 throws NotSupportedError)
          ok = false;
        }
      }

      // Strategy 2: Zero-network fallback to pure-JS TweetNaCl for ₹5,000 legacy guard phones
      if (!ok && typeof nacl !== "undefined" && nacl.sign && nacl.sign.detached) {
        try {
          ok = nacl.sign.detached.verify(msgBytes, sigBytes, pubBytes);
        } catch (naclErr) {
          ok = false;
        }
      }

      if (!ok) {
        return show("bad", "REJECTED: Forged or Tampered Pass\nCryptographic signature verification failed.");
      }

      const data = JSON.parse(new TextDecoder().decode(b64urlToBytes(body)));
      const now = Math.floor(Date.now() / 1000);
      if (data.exp && data.exp < now) {
        return show("bad", "EXPIRED PASS\nAsk worker to renew credentials.");
      }

      show("ok", `✅ LIVE & VERIFIED PASS\nWorker ID: ${data.wid || data.name || 'Verified'}\nIssued by Sovereign Protocol`);
    } catch (e) {
      show("bad", "NOT VALID: " + e.message);
    }
  }

  document.getElementById("checkManual").onclick = () =>
    checkCode(document.getElementById("manual").value);

  let scanning = false;
  document.getElementById("startCam").onclick = async () => {
    if (scanning) return;
    const video = document.getElementById("cam");
    const canvas = document.getElementById("frame");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
      });
      video.srcObject = stream;
      await video.play();
      scanning = true;
      show("idle", "Point the camera at the code");
      const tick = () => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if (code) {
            scanning = false;
            stream.getTracks().forEach((t) => t.stop());
            return checkCode(code.data);
          }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    } catch (e) {
      show("bad", "Camera unavailable: use the paste box instead");
    }
  };
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
